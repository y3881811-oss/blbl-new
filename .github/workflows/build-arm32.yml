name: Build ARM32 Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Lock ABI to armeabi-v7a
        run: |
          # 在 app/build.gradle.kts 中强制只保留 32 位 ARM
          sed -i '/ndk {/,/}/ s/abiFilters.*$/abiFilters += listOf("armeabi-v7a")/' app/build.gradle.kts
          # 如果没有 ndk 块，追加一个
          if ! grep -q "abiFilters" app/build.gradle.kts; then
            sed -i '/defaultConfig {/a\        ndk { abiFilters += listOf("armeabi-v7a") }' app/build.gradle.kts
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PversionName=0.1.30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blbl-arm32-debug
          path: app/build/outputs/apk/debug/*.apk